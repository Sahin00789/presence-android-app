name: Server CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'server/**'
      - '.github/workflows/server-ci-cd.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'server/**'
      - '.github/workflows/server-ci-cd.yml'
  workflow_dispatch:

jobs:
  typecheck-and-lint:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Verify Drizzle Migration Generation
        run: npm run db:generate

      - name: Build TypeScript Project
        run: npm run build

  unit-and-integration-tests:
    name: Run Vitest Suite & DB Migrations
    needs: typecheck-and-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: presence_user
          POSTGRES_PASSWORD: presence_password
          POSTGRES_DB: presence_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Drizzle Schema Migrations
        run: npm run db:generate

      - name: Run Drizzle Database Migrations
        env:
          DATABASE_URL: postgresql://presence_user:presence_password@localhost:5432/presence_db
          ACCESS_TOKEN_SECRET: ci_access_token_secret_at_least_32_characters
          REFRESH_TOKEN_SECRET: ci_refresh_token_secret_at_least_32_characters
          GOOGLE_WEB_CLIENT_ID: ci-client.apps.googleusercontent.com
          CLOUDINARY_CLOUD_NAME: ci-cloud
          CLOUDINARY_API_KEY: ci-key
          CLOUDINARY_API_SECRET: ci-secret
        run: npm run db:migrate

      - name: Execute Vitest Tests
        env:
          NODE_ENV: test
          PORT: 3000
          HOST: 0.0.0.0
          DATABASE_URL: postgresql://presence_user:presence_password@localhost:5432/presence_db
          ACCESS_TOKEN_SECRET: ci_access_token_secret_at_least_32_characters
          REFRESH_TOKEN_SECRET: ci_refresh_token_secret_at_least_32_characters
          GOOGLE_WEB_CLIENT_ID: ci-client.apps.googleusercontent.com
          CLOUDINARY_CLOUD_NAME: ci-cloud
          CLOUDINARY_API_KEY: ci-key
          CLOUDINARY_API_SECRET: ci-secret
        run: npm run test

  deploy:
    name: Deploy to VPS
    needs: unit-and-integration-tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy to VPS Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 129.225.86.221
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            cd /opt/presence
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            npm run db:migrate
            pm2 restart presence-api --update-env
            sleep 3
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/health/ready; then
                echo "VPS Health check passed."
                exit 0
              fi
              sleep 2
            done
            echo "Health check did not pass within 60s"
            exit 1


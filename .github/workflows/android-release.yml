name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'server/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Upload Latest Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK Generated
        run: |
          if [ -f "app/build/outputs/apk/release/presence.apk" ]; then
            echo "APK generated successfully at app/build/outputs/apk/release/presence.apk"
          else
            echo "ERROR: presence.apk not found!"
            exit 1
          fi

      - name: Update GitHub Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Presence Android App (Latest Release)"
          body: "Latest release build of `presence.apk`. Uploaded automatically on push to `main`."
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/presence.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

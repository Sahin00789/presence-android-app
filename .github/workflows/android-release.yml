name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'server/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

# Required by softprops/action-gh-release to create the versioned release and
# upload presence.apk with the default GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Upload Latest Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Read Android version
        id: android_version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK Generated
        run: |
          if [ -f "app/build/outputs/apk/release/presence.apk" ]; then
            echo "APK generated successfully at app/build/outputs/apk/release/presence.apk"
          else
            echo "ERROR: presence.apk not found!"
            exit 1
          fi

      - name: Publish Versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.android_version.outputs.version }}
          name: "Presence v${{ steps.android_version.outputs.version }}"
          body: "Release v${{ steps.android_version.outputs.version }} of `presence.apk`. Uploaded automatically on push to `main`."
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/presence.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
